[project]
name = "lmr"
version = "0.3.0"
description = "Offline research assistant over a pinned Wikipedia corpus: BM25, a 17M reranker and a local LLM, plus the research substrate that chose them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "David Hatley" }]

[project.scripts]
lmr = "lmr.cli:main"

[project.optional-dependencies]
rerank = ["sentence-transformers>=5", "torch>=2.4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmr*", "substrate*", "eval*", "experiments*"]

[tool.setuptools.package-data]
lmr = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
