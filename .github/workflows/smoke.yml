name: smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (no reranker extra: tests do not need torch)
        run: python -m pip install -e ".[dev]"
      - name: CLI imports and prints help
        run: lmr --help
      - name: Tests
        run: python -m pytest -q
